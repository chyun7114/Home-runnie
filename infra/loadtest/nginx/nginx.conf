events {
  worker_connections 1024;
}

http {
  map $cookie_accessToken $lb_key {
    default $cookie_accessToken;
    ""      $remote_addr;
  }

  log_format upstreamlog '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'ua="$http_user_agent" upstream="$upstream_addr" lb_key="$lb_key" cookie_token="$cookie_accessToken"';

  access_log /var/log/nginx/access.log upstreamlog;

  upstream backend_v2_ws {
    hash $lb_key consistent;
    server backend-1:3030;
    server backend-2:3030;
    server backend-3:3030;
  }

  server {
    listen 80;
    server_name _;

    location /socket.io/ {
      proxy_pass http://backend_v2_ws/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      add_header X-Upstream-Addr $upstream_addr always;
    }

    location / {
      proxy_pass http://backend_v2_ws;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}
